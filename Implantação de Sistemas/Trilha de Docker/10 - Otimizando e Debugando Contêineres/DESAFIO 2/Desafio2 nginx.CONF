# ============================================================
# NGINX.CONF — Proxy reverso: Vue SPA + API Node.js
# Desafio 2 | Módulo 10 | Trilha de Docker | UniSENAI 2026
# ============================================================
# Este Nginx centraliza todo o tráfego:
#   GET /         → serve o build estático do Vue (index.html + assets)
#   GET /api/*    → faz proxy para o backend Node.js (porta 3000)
#
# O frontend Vue faz chamadas para /api/itens, /api/health, etc.
# O Nginx intercepta e redireciona para o serviço "backend" internamente.
# O navegador não sabe que existe um serviço separado na porta 3000.

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;
    gzip         on;
    gzip_types   text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name localhost;

        # ── LOCATION 1: proxy reverso para a API Node.js ────────
        # location /api/ → intercepta TODAS as URLs que começam com /api/
        # Prioridade: localizations mais específicas têm prioridade sobre /
        # Então /api/itens cai aqui, e /sobre cai no location / abaixo
        location /api/ {
            # proxy_pass → redireciona a requisição para o serviço backend
            # "backend" = nome do serviço definido no docker-compose.yml
            # A barra no final de http://backend:3000/ é importante:
            #   Com barra → /api/itens vira /itens no backend
            #   Sem barra → /api/itens chegaria como /api/itens no backend
            proxy_pass http://backend:3000/api/;

            # proxy_http_version 1.1 → usa HTTP/1.1 para suportar keep-alive
            proxy_http_version 1.1;

            # Upgrade e Connection → necessários para WebSockets (opcional)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Host → repassa o cabeçalho Host original da requisição
            proxy_set_header Host $host;

            # X-Real-IP → informa ao Node.js o IP real do cliente
            # Sem isso, o backend veria sempre o IP do Nginx (172.x.x.x)
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # proxy_cache_bypass → desabilita cache para a API (dados dinâmicos)
            proxy_cache_bypass $http_upgrade;

            # Timeouts → evita que o Nginx desista rápido demais de queries lentas
            proxy_connect_timeout 60s;
            proxy_read_timeout    60s;
        }

        # ── LOCATION 2: frontend Vue (SPA) ──────────────────────
        # location / → captura todas as demais URLs
        location / {
            # root → pasta onde o build do Vue foi copiado no Dockerfile
            root /usr/share/nginx/html;
            index index.html;

            # try_files → essencial para Vue Router no modo "history"
            # Sem isso, acessar /sobre diretamente retornaria 404
            # porque não existe um arquivo físico chamado "sobre"
            # A linha abaixo diz: tente o arquivo → tente o diretório →
            # se não encontrar, serve o index.html (e o Vue Router assume o controle)
            try_files $uri $uri/ /index.html;
        }

        # ── LOCATION 3: cache de assets estáticos ───────────────
        # Arquivos de build do Vite têm hash no nome (ex: index-Bx92k3.js)
        # Como o nome muda a cada build, é seguro cachear por muito tempo
        location ~* \.(js|css|png|jpg|ico|woff2?)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;  # não registrar acesso a arquivos estáticos (reduz I/O)
        }
    }
}