# ============================================================
# NGINX.CONF — Servidor para aplicação PHP via PHP-FPM
# ============================================================
# O Nginx NÃO executa PHP diretamente. Ele recebe a requisição
# HTTP e a encaminha ao PHP-FPM (porta 9000) via protocolo FastCGI.
# O PHP-FPM processa e devolve o HTML gerado ao Nginx, que envia
# ao cliente. Isso é chamado de "proxy FastCGI".

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        # listen 80 → porta HTTP padrão onde o Nginx aguarda requisições
        listen 80;
        server_name localhost;

        # root → pasta raiz onde os arquivos PHP da aplicação estão
        # Deve coincidir com o WORKDIR do Dockerfile do PHP
        root /var/www/html;

        # index → arquivo padrão servido quando a URL aponta para um diretório
        # Tenta index.php primeiro, depois index.html como fallback
        index index.php index.html;

        # ── LOCATION 1: rota principal ───────────────────────────
        location / {
            # try_files → tenta servir o arquivo/diretório solicitado
            # $uri        → tenta o caminho exato (ex: /imagem.jpg)
            # $uri/       → tenta como diretório
            # /index.php?$query_string → fallback: passa tudo ao index.php
            #               Permite que frameworks PHP (Laravel, Slim) capturem
            #               todas as rotas no arquivo de entrada (front controller)
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── LOCATION 2: processamento de arquivos .php ───────────
        # ~ \.php$ → expressão regular que casa com qualquer URL terminada em .php
        location ~ \.php$ {
            # fastcgi_pass → encaminha a requisição ao PHP-FPM
            # "php" é o nome do serviço definido no docker-compose.yml
            # 9000 é a porta padrão do PHP-FPM
            fastcgi_pass php:9000;

            # fastcgi_index → arquivo PHP padrão para URLs sem arquivo específico
            fastcgi_index index.php;

            # fastcgi_param SCRIPT_FILENAME → informa ao PHP-FPM qual arquivo executar
            # $document_root → substitui pelo valor de "root" definido acima (/var/www/html)
            # $fastcgi_script_name → caminho relativo do script solicitado
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # include fastcgi_params → importa parâmetros FastCGI padrão do Nginx
            # Inclui variáveis como REQUEST_METHOD, QUERY_STRING, SERVER_PORT, etc.
            include fastcgi_params;
        }

        # ── LOCATION 3: bloquear acesso a arquivos .htaccess ─────
        # Impede que usuários acessem arquivos de configuração sensíveis
        location ~ /\.ht {
            deny all;
        }
    }
}